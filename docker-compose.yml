services:
  whopper-watt:
    # Entweder das fertige Image aus der Registry ...
    image: ghcr.io/diesteinhose/enbe-plus-whopper:latest
    # ... oder selbst bauen: dafuer die Zeile darueber auskommentieren.
    # build: .
    container_name: whopper-watt
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Optional: eigener Datenbestand statt des im Image eingebackenen.
      # Zum Aktualisieren im Container laufen lassen:
      #   docker compose exec whopper-watt python3 server/ingest.py
      - ./server/data:/app/server/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
