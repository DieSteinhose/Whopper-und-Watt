name: Android

# Die Android-App lebt auf dem Branch app. Der Branch pwa traegt diese Datei nur
# mit, weil er aus derselben Geschichte stammt; dort soll sie nichts tun.
# GitHub liest die Workflow-Datei aus dem Branch, auf den gepusht wird, also
# steht die Einschraenkung hier und nicht anderswo.
on:
  push:
    branches: [app]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Unit-Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: APKs bauen
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
