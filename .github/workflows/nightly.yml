name: Nightly

# Jede Nacht: Daten neu einsammeln und die Seite veroeffentlichen.
#
# Achtung, GitHub-Eigenheit: geplante Laeufe starten ausschliesslich auf dem
# Standard-Branch des Repositories. Solange dieser Branch nicht der Standard ist
# oder dorthin gemerged wurde, feuert der Zeitplan nicht. Von Hand geht es ueber
# "Run workflow" jederzeit.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [pwa]
    paths:
      - "server/**"
      - "web/**"
      - "tests/**"
      - ".github/workflows/nightly.yml"

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python-Tests
        run: python3 -m unittest discover -s tests -v
      # Ohne die Exportdateien unter web/data ueberspringt local-search.test.mjs
      # die Tests, die den Datenbestand brauchen. Der Rest laeuft trotzdem, und
      # gegen echte Daten laufen sie im Job "Datenbestand" noch einmal komplett.
      - name: Node-Tests
        run: node --test tests/opening-hours.test.mjs tests/local-search.test.mjs

  data:
    name: Datenbestand
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # server/data/ enthaelt nur die erzeugte Datenbank und ist deshalb nicht im
      # Repository. Git kennt keine leeren Verzeichnisse, im Checkout gibt es das
      # Verzeichnis also nicht, und ohne diesen Schritt scheitert das spaetere mv
      # mit "No such file or directory".
      - name: Verzeichnis fuer die Datenbank anlegen
        run: mkdir -p server/data

      # Die Datenbank ist rund 50 MB gross und aendert sich bei jedem Ingest
      # komplett. Im Repository waere sie am falschen Platz, also liegt sie im
      # Actions-Cache. Der naechtliche Lauf haelt ihn warm.
      #
      # restore und save getrennt, nicht actions/cache am Stueck: nur restore
      # liefert cache-matched-key, und genau daran haengt unten die Entscheidung,
      # ob eingesammelt werden muss. Gespeichert wird ausserdem nur nach einem
      # frischen Ingest, statt bei jedem Lauf denselben Stand neu abzulegen.
      - name: Datenbank aus dem Cache holen
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: server/data/whopper.sqlite
          key: whopper-db-${{ github.run_id }}
          restore-keys: whopper-db-

      # Bei einem Commit wird normalerweise nicht eingesammelt: ein Ingest dauert
      # eine Viertelstunde und belastet fremde Server, und fuer eine Codeaenderung
      # verschiebt sich keine Ladesaeule. Liegt aber nichts im Cache, gibt es auch
      # nichts zu deployen, dann wird eingesammelt.
      - name: Frisch einsammeln
        id: ingest
        if: github.event_name != 'push' || steps.cache.outputs.cache-matched-key == ''
        continue-on-error: true
        run: python3 server/ingest.py --db fresh.sqlite

      # Der Ingest baut nach fresh.sqlite, also in eine leere Datenbank. Die
      # AFIR-Zuordnung darf dabei nicht verlorengehen: sie wird gespeichert,
      # damit der Preis nicht jede Nacht auf eine andere Saeule im selben
      # Ladepark springt, und ein taegliches Vergessen waere genau das.
      # Uebernommen wird nur, was noch eine Saeule hat.
      - name: Frischen Stand uebernehmen
        if: steps.ingest.outcome == 'success'
        run: |
          python3 server/prices.py --db fresh.sqlite --von server/data/whopper.sqlite --report
          mv fresh.sqlite server/data/whopper.sqlite

      - name: Frischen Stand in den Cache legen
        if: steps.ingest.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: server/data/whopper.sqlite
          key: whopper-db-${{ github.run_id }}

      - name: Stand aus dem Cache verwenden
        if: steps.ingest.outcome != 'success'
        run: |
          if [ ! -s server/data/whopper.sqlite ]; then
            echo "::error::Kein Ingest moeglich und nichts im Cache. Abbruch, statt eine leere Seite zu veroeffentlichen."
            exit 1
          fi
          echo "::warning::Es bleibt beim Stand aus dem Cache."

      # Ad-hoc-Preise nach AFIR Artikel 20, ueber die Mobilithek. Optional:
      # ohne die Variable AFIR_FEEDS passiert hier gar nichts, und die App
      # blendet den Preisknopf dann aus. Zugang muss man selbst einrichten,
      # kostenfrei, aber mit Registrierung und Abonnement:
      #
      #   AFIR_FEEDS         (Variable) URLs der abonnierten Datenangebote,
      #                      eine je Zeile. Tabelle und Status, beides.
      #   AFIR_CLIENT_CERT   (Secret, optional) Client-Zertifikat als PEM
      #   AFIR_CLIENT_KEY    (Secret, optional) zugehoeriger Schluessel als PEM
      #
      # Die Mobilithek authentifiziert Abrufe ueber Client-Zertifikate; ohne
      # die beiden Secrets geht nur, was ohne Anmeldung erreichbar ist.
      - name: Ad-hoc-Preise holen
        id: preise
        if: vars.AFIR_FEEDS != ''
        continue-on-error: true
        env:
          FEEDS: ${{ vars.AFIR_FEEDS }}
          CERT: ${{ secrets.AFIR_CLIENT_CERT }}
          KEY: ${{ secrets.AFIR_CLIENT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p afir
          AUTH=()
          if [ -n "${CERT}" ] && [ -n "${KEY}" ]; then
            printf '%s' "${CERT}" > afir/client.pem
            printf '%s' "${KEY}"  > afir/client.key
            chmod 600 afir/client.pem afir/client.key
            AUTH=(--cert afir/client.pem --key afir/client.key)
          fi
          index=0
          while IFS= read -r url; do
            [ -z "${url}" ] && continue
            index=$((index + 1))
            echo "Hole Datenangebot ${index}"
            curl -fsSL --retry 3 --retry-delay 5 --max-time 300 \
                 "${AUTH[@]}" "${url}" -o "afir/feed-${index}.json"
          done <<< "${FEEDS}"
          rm -f afir/client.pem afir/client.key
          python3 server/prices.py --db server/data/whopper.sqlite afir/feed-*.json
          rm -rf afir

      - name: Statischen Datenbestand schreiben
        run: python3 server/export_static.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Jetzt liegt der Datenbestand da, also laufen auch die Tests, die im
      # Job "Tests" mangels Daten uebersprungen wurden.
      - name: Suche gegen echte Daten pruefen
        run: node --test tests/local-search.test.mjs

      # Der Export besteht aus zwei Dateien, und geprueft werden muss beides:
      # spots.json enthaelt seit der Aufteilung nur noch die Ketten. Wer hier
      # nur die eine Datei liest, sieht nie ein veganes Lokal.
      - name: Bestand pruefen
        run: |
          python3 - <<'PY'
          import json, sys

          base = json.load(open("web/data/spots.json"))
          vegan = json.load(open("web/data/spots-vegan.json"))
          chargers = sum(len(spot["chargers"]) for part in (base, vegan) for spot in part["spots"])
          chains = sum(1 for spot in base["spots"] if spot["brand"])
          only = sum(1 for part in (base, vegan) for spot in part["spots"] if spot["veganOnly"])
          netze = {}
          for part in (base, vegan):
              for spot in part["spots"]:
                  for charger in spot["chargers"]:
                      key = charger["network"] or "(anderes)"
                      netze[key] = netze.get(key, 0) + 1

          print(f"Stand {base['meta'].get('ingested_at')}, {chargers} Ladesaeulen")
          print(f"  spots.json       {len(base['spots']):6d} Lokale, davon {chains} aus einer Kette")
          print(f"  spots-vegan.json {len(vegan['spots']):6d} Lokale")
          print(f"  rein vegan       {only:6d}")
          print("  Netze: " + ", ".join(f"{n} {k}" for k, n in sorted(netze.items())))

          # Ein leerer oder halber Bestand darf nicht online gehen. Die Schwellen
          # sind bewusst deutlich unter den gemessenen Zahlen (1651 / 12655 / 509):
          # sie sollen einen kaputten Lauf abfangen, nicht bei normalen
          # Schwankungen anschlagen.
          if chargers < 1000:
              sys.exit("Zu wenige Ladesaeulen, Abbruch")
          if chains < 300 or chains != len(base["spots"]):
              sys.exit("spots.json ist nicht der Kettenteil, die Aufteilung ist kaputt")
          if len(vegan["spots"]) < 1000:
              sys.exit("Zu wenige vegane Lokale, die diet:vegan-Abfrage ist vermutlich kaputt")
          if only < 50:
              sys.exit("Fast nichts rein vegan, diet:vegan=only wird nicht erkannt")
          # Jede Zeile im Zusatzteil muss auch wirklich vegan sein, sonst zeigt
          # die App unter "Vegane Optionen" irgendetwas an.
          off = [spot["id"] for spot in vegan["spots"] if not spot["vegan"] or spot["brand"]][:5]
          if off:
              sys.exit(f"Nicht-vegane oder Ketten-Eintraege im Zusatzteil: {off}")
          # Die Netz-Knoepfe der App muessen etwas zu zeigen haben. Bleibt eine
          # Spalte leer, hat sich in OSM die Schreibweise geaendert oder die
          # Erkennung ist kaputt, und der Knopf faende nichts.
          for key in ("enbw", "lidl", "kaufland"):
              if netze.get(key, 0) < 20:
                  sys.exit(f"Fast keine Saeulen im Netz {key} ({netze.get(key, 0)}), Erkennung pruefen")
          PY

      # Nur der statische Export wandert weiter. Die Datenbank bleibt im Cache,
      # sie wird zum Deployen nicht gebraucht.
      - uses: actions/upload-artifact@v4
        with:
          name: datenbestand
          path: web/data
          retention-days: 7

  pages:
    name: GitHub Pages
    needs: data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Zielverzeichnis ausdruecklich angeben: upload-artifact schneidet den
      # gemeinsamen Pfadanfang weg, ohne path landeten die Dateien im Wurzel-
      # verzeichnis und die Seite ginge ohne Datenbestand online.
      - uses: actions/download-artifact@v4
        with:
          name: datenbestand
          path: web/data
      - name: Datenbestand kontrollieren
        run: |
          ls -l web/data
          test -s web/data/spots.json
          test -s web/data/spots-vegan.json
      - uses: actions/configure-pages@v5
      # Auf Pages laeuft kein Server, deshalb geht nur das Verzeichnis web/
      # online. Die Suche rechnet dort der Browser aus data/spots.json.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
